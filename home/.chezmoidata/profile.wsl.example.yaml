# WSL profile (auto-selected when the kernel or WSL env vars indicate WSL).
# Graphical / Wayland / GDM features stay off. Packages are apt CLI tools.
profile_wsl_example:
  features:
    zsh: true
    git: true
    fzf: true
    ripgrep: true
    fd: true
    trash_cli: true
    wl_clipboard: false
    keychain: true
    jq: true
    htop: true
    fastfetch: true
    tmux: true
    zoxide: true
    eza: true
    bat: true
    vivid: true
    mise: true
    direnv: true
    oh_my_zsh: true
    p10k: true
    zsh_autosuggestions: true
    zsh_completions: true
    zsh_edit: true
    fzf_tab: true
    zsh_abbr: true
    omz_git: true
    omz_fzf: false
    omz_ssh_agent: true
    omz_python: true
    omz_virtualenv: false
    omz_extract: true
    omz_codeclimate: false
    gpg_signing: false
    desktop_sway: false
    hyprpicker: false
    still: false
    wayneko: false
    swayfx: false
    swappy: false
    kanshi: false
    wayland_session: false
    wezterm: false
    dunst: false
    rofi: false
    desktop_utils: false
    dropbox: false
    onlyoffice: false
    anki: false
    freecad: false
    sunshine: false
    keyd: false
    neovim: true
    cursor: false
    gh_cli: true
    glab: true
    docker: false
    clang: true
    unreal: false
    godot: false
    ffmpeg: true
    yt_dlp: true
    doctl: true
    diff_so_fancy: true
    flatpak: false
    ssh_hardening: false
    grub: false
    displays_resume: false
    hdmi_audio: false
    wake_sources: false
    hibernate: false
    llama: false
    earlyoom: false
    thermald: false
  packages:
    - zsh
    - git
    - curl
    - sudo
    - keychain
    - fzf
    - ripgrep
    - fd-find
    - clang
    - jq
    - htop
    - fastfetch
    - tmux
    - direnv
    - neovim
    - gh
    - glab
    - ffmpeg
    - zoxide
    - eza
    - bat
  systemd_units: []
  system_deploy: []
  identity:
    git_email: ""
    git_ssh_key: ""
  secrets:
    git_gpg_key: ""
  displays:
    laptop:
      match: eDP-1
    devices: {}
    layouts: []
  wake_usb: []
