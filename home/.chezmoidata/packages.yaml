packages:
  ubuntu:
    # Never install via apt — use run_onchange_after_install-wezterm.sh (apt.fury.io) instead
    apt_exclude:
      - kitty
      - wezterm
      # xrandr hotplug tool; conflicts with kanshi on sway Wayland (never install).
      - autorandr
    # Never install these on WSL (no Wayland session, GDM, or desktop stack).
    apt_headless_exclude:
      - sway
      - swaylock
      - swayidle
      - swaybg
      - waybar
      - kanshi
      - grim
      - slurp
      - wl-clipboard
      - py3status
      - dunst
      - rofi
      - bemenu
      - libbemenu-wayland
      - j4-dmenu-desktop
      - playerctl
      - brightnessctl
      - acpi
      - libnotify-bin
      - keyd
      - network-manager
      - network-manager-gnome
      - pipewire-pulse
      - libwayland-dev
      - libwayland-bin
      - wayland-protocols
      - gdm
      - gdm3
      - ubuntu-desktop
      - ubuntu-desktop-minimal
      - grub-common
      - grub-efi-amd64
      - grub-efi-amd64-signed
    apt:
      # Shell and core CLI
      - zsh
      - git
      - curl
      - sudo
      - keychain
      - fzf
      - ripgrep
      - fd-find
      - clang
      - jq
      - htop
      - fastfetch
      - tmux
      - direnv
      # Desktop (Sway/Wayland; installed on real machines; harmless in CI)
      - sway
      - swaylock
      - swayidle
      - swaybg
      - waybar
      - kanshi
      - grim
      - slurp
      - wl-clipboard
      - py3status
      - dunst
      - rofi
      - bemenu
      - libbemenu-wayland
      - j4-dmenu-desktop
      - playerctl
      - brightnessctl
      - acpi
      - libnotify-bin
      - keyd
      - network-manager
      - network-manager-gnome
      - pipewire-pulse
      - flatpak
      # Editors and dev tools
      - neovim
      - gh
      - glab
      - ffmpeg
      # System services
      - openssh-server
      - grub-common
      - grub-efi-amd64
      - grub-efi-amd64-signed
      - systemd
      - udev
      - earlyoom
      - thermald
      # VPN packages omitted — configure manually (see docs/vpn-setup.md)
    apt_ci:
      # Minimal set for Docker E2E (shell + smoke test)
      - zsh
      - git
      - curl
      - sudo
      - keychain
      - fzf
      - ripgrep
      - fd-find
      - trash-cli
      - wl-clipboard
      - vivid
      - clang
      - jq
      - neovim
      - openssh-server
      - systemd
      - zoxide
      - eza
      - bat
  termux:
    pkg:
      # Installed via apt full-upgrade + apt install on Android (see run_onchange_before_install-packages).
      - bash
      - zsh
      - git
      - curl
      - openssh
      - keychain
      - fzf
      - ripgrep
      - fd
      - bat
      - eza
      - zoxide
      - jq
      - htop
      - tmux
      - direnv
      - neovim
      - make
      - clang
      - cmake
      - gh
      - python
      - vivid
      - termux-api
  darwin:
    # Homebrew formulae (no casks, no Wayland). Used on macOS when the
    # profile does not list packages.
    brew:
      - zsh
      - git
      - curl
      - keychain
      - fzf
      - ripgrep
      - fd
      - trash
      - jq
      - htop
      - fastfetch
      - tmux
      - zoxide
      - eza
      - bat
      - vivid
      - mise
      - direnv
      - neovim
      - gh
      - glab
      - ffmpeg
      - yt-dlp
      - doctl
    brew_ci:
      # Minimal set for macOS GitHub Actions E2E
      - zsh
      - git
      - curl
      - keychain
      - fzf
      - ripgrep
      - fd
      - jq
      - neovim
      - zoxide
      - eza
      - bat
      - vivid
