# Sunshine config — https://docs.lizardbyte.dev/projects/sunshine/latest/md_docs_2configuration.html
# Pair Moonlight clients at https://localhost:47990 after first start.

# Force KMS capture instead of the default wlr screencopy backend.
#
# On this hybrid-GPU layout (sway-session: Intel is the primary wlroots
# renderer, the NVIDIA dGPU scans out the dock displays via a Vulkan
# importer), wlr screencopy asks the compositor to blit an NVIDIA-scanout
# output into a Sunshine-allocated dmabuf. That blit is a cross-GPU import
# the NVIDIA-side Vulkan renderer rejects, so every frame logs
# "[wayland] Frame capture failed" and Moonlight shows a black screen.
#
# KMS capture reads scanout framebuffers straight from DRM instead, and its
# hybrid-GPU device selection keeps each pipeline on one GPU: NVENC only
# pairs with NVIDIA-connected displays (docked), and VAAPI only with the
# Intel panel (undocked). Requires cap_sys_admin, which the official deb
# already sets on /usr/bin/sunshine. Leave encoder/adapter_name on auto so
# that fallback keeps working; card numbers race at boot anyway.
capture = kms
