[project]
name = "prompt"
version = "0.1.0"
description = "Terminal prompt CLI for local llama-swap with Textual streaming UI"
requires-python = ">=3.11"
dependencies = [
    "textual>=8.2.8",
]

[project.scripts]
prompt = "prompt.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
