# nvidia-drm.fbdev=1 (the 595 default with modeset=1) registers nvidia-drmdrmfb
# during "Failed to get dynamic displays" probing, then flip-timeouts on head 0.
# That races USB-C MST enumeration on this dock: only two of three DP streams
# come up, and GDM's greeter can freeze when the fbdev appears mid-run.
# Keep KMS (modeset=1 from nvidia-graphics-drivers-kms.conf); skip the fbdev.
options nvidia_drm fbdev=0
