# Long passive HDMI (e.g. 50ft) + NVIDIA HDA: runtime PM and bus snooping
# amplify PCIe interrupt micro-stalls and starve PipeWire's audio buffer.
# Keep the controller awake and disable snooping so snd_hda_intel does not
# fight the NVIDIA IRQ path (legacy IRQ 17 on this host; MSI rejected).
options snd_hda_intel power_save=0 power_save_controller=N snoop=0
