# Deployed by chezmoi (deploy-system); @NVIDIA_PCI@ is substituted at deploy
# time with the dGPU's PCI address.
#
# The NVIDIA open kernel module can take ~25s to initialize (GSP boot plus
# "Failed to get dynamic displays during device registration" probing). GDM's
# greeter starts on the iGPU at ~16s, so on slow-init boots the NVIDIA DRM
# device appears underneath the already-running greeter. mutter's
# secondary-GPU hotplug path then corrupts its internal state
# ("g_hash_table_insert_internal: assertion 'hash_table != NULL' failed") and
# the greeter freezes hard once the nvidia-drm fbdev registers: the cursor
# still moves (dedicated KMS thread) but clicks and VT switching are dead and
# only a hard reset recovers.
#
# Waiting for the card node before starting GDM lets the greeter enumerate the
# GPU at startup instead of hotplugging it mid-run. The "-" prefix keeps a
# missing or dead dGPU from ever blocking login: worst case is a 60s delay.
[Service]
ExecStartPre=-/usr/bin/udevadm wait --timeout=60 /dev/dri/by-path/pci-@NVIDIA_PCI@-card
